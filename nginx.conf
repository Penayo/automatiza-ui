server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the engine container (strips /api prefix)
    location /api/ {
        # nginx defaults to 1m and rejects bigger bodies with its own HTML 413,
        # before the request ever reaches the engine. Keep this comfortably above
        # MAX_UPLOAD_BYTES (50 MB default) so the app's own limit is the one that
        # applies and clients get the JSON PayloadTooLargeException instead.
        client_max_body_size 60m;

        proxy_pass http://engine:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
